services:
  frontend:
    build: ./my-app
    ports:
      - "5173:5173"

    depends_on:
      - api

    command: npm run dev -- --host

  api:
    build: ./server
    ports:
      - "8000:8000"

    env_file:
      - ./server/.env

    depends_on:
      - postgres

    command: .venv/bin/python main.py

  postgres:
    image: postgres:18

    env_file:
      - ./server/.env

    # environment:
    #   POSTGRES_USER: ${POSTGRES_USER}
    #   POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    #   POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5432:5432"