services:
  api:
    build: .
    ports:
      - 8000:8000

    env_file:
      - .env

    depends_on:
      - postgres

    command: .venv/bin/python main.py

  postgres:
    image: postgres:18

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - 5432:5432